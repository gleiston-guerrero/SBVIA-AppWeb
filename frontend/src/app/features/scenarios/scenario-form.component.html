<div class="form-container">
  <div class="form-card">
    <div class="form-header">
      <h2>{{ isEditMode ? 'Editar Scenario' : 'Nuevo Scenario' }}</h2>
      <a routerLink="/scenarios" class="btn-close">&times;</a>
    </div>

    <form [formGroup]="escenarioForm" (ngSubmit)="onSubmit()">
      
      <div class="form-group">
        <label for="name">Nombre del Escenario</label>
        <input 
          type="text" 
          id="name" 
          formControlName="name" 
          placeholder="Ej: Curva Peligrosa en Lluvia"
          [class.invalid]="escenarioForm.get('name')?.invalid && escenarioForm.get('name')?.touched">
        <div class="error-msg" *ngIf="escenarioForm.get('name')?.invalid && escenarioForm.get('name')?.touched">
          El nombre es requerido y debe ser menor a 100 caracteres.
        </div>
      </div>

      <div class="form-group">
        <label for="description">Descripción</label>
        <textarea 
          id="description" 
          formControlName="description" 
          rows="3"
          placeholder="Detalles sobre el escenario y sus desafíos..."></textarea>
      </div>

      <div class="form-row">
        <div class="form-group half-width">
          <label for="roadType">Tipo de Vía</label>
          <select id="roadType" formControlName="roadType" [class.invalid]="escenarioForm.get('roadType')?.invalid && escenarioForm.get('roadType')?.touched">
            <option value="" disabled selected>Seleccione...</option>
            <option value="URBANA">Urbana</option>
            <option value="RURAL">Rural</option>
            <option value="AUTOPISTA">Autopista</option>
            <option value="INTERSECCION">Intersección</option>
          </select>
        </div>

        <div class="form-group half-width">
          <label for="difficultyLevel">Nivel de Dificultad</label>
          <select id="difficultyLevel" formControlName="difficultyLevel">
            <option value="" disabled selected>Seleccione...</option>
            <option value="BASICO">Básico</option>
            <option value="INTERMEDIO">Intermedio</option>
            <option value="AVANZADO">Avanzado</option>
            <option value="EXPERTO">Experto</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group half-width">
          <label for="weatherType">Condición Climática</label>
          <select id="weatherType" formControlName="weatherType" [class.invalid]="escenarioForm.get('weatherType')?.invalid && escenarioForm.get('weatherType')?.touched">
            <option value="" disabled selected>Seleccione...</option>
            <option value="DESPEJADO">Despejado</option>
            <option value="LLUVIA">Lluvia</option>
            <option value="NIEBLA">Niebla</option>
            <option value="TORMENTA">Tormenta</option>
          </select>
        </div>

        <div class="form-group half-width">
          <label for="trafficDensity">Densidad de Tráfico</label>
          <select id="trafficDensity" formControlName="trafficDensity" [class.invalid]="escenarioForm.get('trafficDensity')?.invalid && escenarioForm.get('trafficDensity')?.touched">
            <option value="" disabled selected>Seleccione...</option>
            <option value="BAJA">Baja</option>
            <option value="MEDIA">Media</option>
            <option value="ALTA">Alta</option>
            <option value="MUY_ALTA">Muy alta</option>
          </select>
        </div>
      </div>

      <div *ngIf="errorMessage" class="error-banner">
        {{ errorMessage }}
      </div>

      <div class="form-actions">
        <button type="button" class="btn-cancel" routerLink="/scenarios">Cancelar</button>
        <button type="submit" class="btn-primary" [disabled]="loading || escenarioForm.invalid">
          {{ loading ? 'Guardando...' : 'Guardar escenario' }}
        </button>
      </div>

    </form>
  </div>
</div>
